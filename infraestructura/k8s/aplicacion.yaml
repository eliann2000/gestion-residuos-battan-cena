apiVersion: v1
kind: Namespace
metadata:
  name: residuos
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: residuos
spec:
  replicas: 2
  selector:
    matchLabels: {app: residuos-api}
  template:
    metadata:
      labels: {app: residuos-api}
    spec:
      containers:
        - name: api
          image: residuos-api:1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: residuos-config, key: DATABASE_URL}}
            - name: DEMO
              value: "1"
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /live, port: 8080}
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: residuos
spec:
  selector: {app: residuos-api}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: residuos
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api}
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: api, namespace: residuos}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: residuos-api}
