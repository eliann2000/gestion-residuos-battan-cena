services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: residuos
      POSTGRES_USER: residuos
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env}
    volumes: ["datos:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U residuos -d residuos"]
      interval: 5s
      retries: 15
  api:
    build: ../servidor
    environment:
      DATABASE_URL: postgresql://residuos:${DB_PASSWORD}@db:5432/residuos
      DEMO: "1"
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      retries: 3
  entrada:
    image: nginx:1.28-alpine
    ports: ["8080:8080"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api]
  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alertas.yml:/etc/prometheus/alertas.yml:ro
  grafana:
    image: grafana/grafana:12.1.0
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: docente
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Definir GRAFANA_PASSWORD en .env}
    volumes:
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/residuos.yml:ro
      - ./grafana-provider.yml:/etc/grafana/provisioning/dashboards/residuos.yml:ro
      - ./dashboard.json:/var/lib/grafana/dashboards/residuos.json:ro
volumes:
  datos:
